services:
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: ghcr.io/joelhooks/sandbox-computer:latest
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      SHELL: /usr/bin/zsh
      TERM: xterm-256color
    # Only published when the sandbox is started with `--service-ports`
    # (see scripts/sandbox-ui-url.sh). Common dev-server ports; add more
    # per-project by overriding this file, not by editing the template.
    ports:
      - "3000:3000"
      - "4000:4000"
      - "5173:5173"
      - "8080:8080"
      - "8787:8787"
    volumes:
      - .:/workspace
      - sandbox-pi:/home/sandbox/.pi
      - sandbox-claude:/home/sandbox/.claude
      - sandbox-codex:/home/sandbox/.codex
      - sandbox-opencode:/home/sandbox/.opencode
      - sandbox-herdr:/home/sandbox/.config/herdr
      - pnpm-store:/home/sandbox/.local/share/pnpm/store
    command: zsh

# Fixed global names so every project scaffolded from this template shares
# one set of volumes per machine: log in to each CLI once and every sandbox
# on that machine reuses it. Without `name:`, Compose prefixes volumes with
# the project directory name, which silently scopes auth per-project and
# forces a re-login for every new project.
#
# Consequence: `docker compose down --volumes` in ANY project wipes this
# machine-wide state. To reset one tool deliberately, use
# `docker volume rm sandbox-<tool>` instead.
volumes:
  sandbox-pi:
    name: sandbox-pi
  sandbox-claude:
    name: sandbox-claude
  sandbox-codex:
    name: sandbox-codex
  sandbox-opencode:
    name: sandbox-opencode
  sandbox-herdr:
    name: sandbox-herdr
  pnpm-store:
    name: sandbox-pnpm-store
